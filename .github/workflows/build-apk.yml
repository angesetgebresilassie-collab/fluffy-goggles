name: Build debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - "**.md"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The project as exported doesn't include the gradlew script/jar
      # (only gradle/wrapper/gradle-wrapper.properties), so we let
      # gradle/actions/setup-gradle install the exact Gradle version that
      # file points at and invoke `gradle` directly instead of `./gradlew`.
      - name: Read required Gradle version
        id: gradle_version
        run: |
          VERSION=$(grep -oP 'distributionUrl=.*gradle-\K[0-9.]+(?=-bin\.zip)' gradle/wrapper/gradle-wrapper.properties)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.gradle_version.outputs.version }}

      # debugConfig in app/build.gradle.kts signs debug builds with a
      # repo-local ${rootDir}/debug.keystore, which isn't committed
      # (it's git-ignored, like any keystore should be). Generate the
      # standard Android debug keystore in that exact spot so signing
      # doesn't fail. This is the well-known, non-secret default
      # debug key - fine for CI/local debug builds, never for release.
      - name: Generate debug keystore
        run: |
          keytool -genkey -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: streamsync-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
